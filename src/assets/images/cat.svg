<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Body -->
  <ellipse cx="100" cy="155" rx="55" ry="50" fill="#F4A261"/>
  <!-- Head -->
  <circle cx="100" cy="90" r="45" fill="#F4A261"/>
  <!-- Left ear -->
  <polygon points="62,55 50,20 85,50" fill="#F4A261"/>
  <polygon points="65,52 55,28 82,50" fill="#FF8FAB"/>
  <!-- Right ear -->
  <polygon points="138,55 150,20 115,50" fill="#F4A261"/>
  <polygon points="135,52 145,28 118,50" fill="#FF8FAB"/>
  <!-- Face markings -->
  <ellipse cx="100" cy="100" rx="28" ry="22" fill="#FDDCB5"/>
  <!-- Left eye -->
  <ellipse cx="82" cy="82" rx="9" ry="10" fill="white"/>
  <ellipse cx="82" cy="83" rx="6" ry="7" fill="#2d2d44"/>
  <circle cx="84" cy="81" r="2" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="118" cy="82" rx="9" ry="10" fill="white"/>
  <ellipse cx="118" cy="83" rx="6" ry="7" fill="#2d2d44"/>
  <circle cx="120" cy="81" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="100" cy="98" rx="5" ry="4" fill="#FF8FAB"/>
  <!-- Mouth -->
  <path d="M95 103 Q100 109 105 103" stroke="#7a4f3a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Whiskers left -->
  <line x1="60" y1="97" x2="88" y2="100" stroke="#888" stroke-width="1.2"/>
  <line x1="58" y1="103" x2="87" y2="103" stroke="#888" stroke-width="1.2"/>
  <line x1="62" y1="109" x2="88" y2="105" stroke="#888" stroke-width="1.2"/>
  <!-- Whiskers right -->
  <line x1="140" y1="97" x2="112" y2="100" stroke="#888" stroke-width="1.2"/>
  <line x1="142" y1="103" x2="113" y2="103" stroke="#888" stroke-width="1.2"/>
  <line x1="138" y1="109" x2="112" y2="105" stroke="#888" stroke-width="1.2"/>
  <!-- Left arm (raised) -->
  <ellipse cx="52" cy="148" rx="14" ry="28" fill="#F4A261" transform="rotate(-30 52 148)"/>
  <!-- Right arm (raised) -->
  <ellipse cx="148" cy="148" rx="14" ry="28" fill="#F4A261" transform="rotate(30 148 148)"/>
  <!-- Left paw -->
  <circle cx="42" cy="130" r="12" fill="#F4A261"/>
  <ellipse cx="37" cy="133" rx="4" ry="5" fill="#FDDCB5"/>
  <ellipse cx="42" cy="135" rx="4" ry="5" fill="#FDDCB5"/>
  <ellipse cx="47" cy="133" rx="4" ry="5" fill="#FDDCB5"/>
  <!-- Right paw -->
  <circle cx="158" cy="130" r="12" fill="#F4A261"/>
  <ellipse cx="153" cy="133" rx="4" ry="5" fill="#FDDCB5"/>
  <ellipse cx="158" cy="135" rx="4" ry="5" fill="#FDDCB5"/>
  <ellipse cx="163" cy="133" rx="4" ry="5" fill="#FDDCB5"/>
  <!-- Left leg -->
  <ellipse cx="75" cy="198" rx="16" ry="22" fill="#F4A261"/>
  <!-- Right leg -->
  <ellipse cx="125" cy="198" rx="16" ry="22" fill="#F4A261"/>
  <!-- Left foot -->
  <ellipse cx="75" cy="214" rx="18" ry="8" fill="#FDDCB5"/>
  <!-- Right foot -->
  <ellipse cx="125" cy="214" rx="18" ry="8" fill="#FDDCB5"/>
  <!-- Tail -->
  <path d="M150 180 Q185 160 190 130 Q195 110 175 105" stroke="#F4A261" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Tail tip -->
  <circle cx="175" cy="105" r="10" fill="#E76F51"/>
  <!-- Belly spot -->
  <ellipse cx="100" cy="158" rx="22" ry="18" fill="#FDDCB5"/>
  <!-- Blush left -->
  <ellipse cx="70" cy="95" rx="9" ry="6" fill="#FFB3C1" opacity="0.6"/>
  <!-- Blush right -->
  <ellipse cx="130" cy="95" rx="9" ry="6" fill="#FFB3C1" opacity="0.6"/>
</svg>
